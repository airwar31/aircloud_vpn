version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - xray-api
    restart: unless-stopped
    networks:
      - vpn-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  agreement-server:
    build:
      context: .
      dockerfile: Dockerfile.agreement
    container_name: agreement-server
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - vpn-network

  xray-api:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    container_name: xray-vpn
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"  # API порт
      - "8443:443"   # VPN порт (изменен для nginx)
    env_file:
      - .env
    environment:
      - SERVER_DOMAIN=air31cloud.ru
    volumes:
      - ./xray-config:/etc/xray
      - ./xray-logs:/var/log/xray
    restart: unless-stopped
    networks:
      - vpn-network

  vpn-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: vpn-bot
    env_file:
      - .env
    environment:
      - XRAY_API_URL=http://xray-api:8080
    volumes:
      - ./bot-data:/shared
    depends_on:
      - xray-api
    restart: unless-stopped
    networks:
      - vpn-network
      

  cleanup-service:
    build:
      context: .
      dockerfile: Dockerfile.cleanup
    container_name: cleanup-service
    env_file:
      - .env
    environment:
      - XRAY_API_URL=http://xray-api:8080
    volumes:
      - ./bot-data:/shared
    depends_on:
      - xray-api
    restart: unless-stopped
    networks:
      - vpn-network
      
  notify-service:
    build:
      context: .
      dockerfile: Dockerfile.notify
    container_name: notify-service
    env_file:
      - .env
    volumes:
      - ./bot-data:/shared
    depends_on:
      - vpn-bot
    restart: unless-stopped
    networks:
      - vpn-network

networks:
  vpn-network:
    driver: bridge

volumes:
  xray-config:
  xray-logs:
  bot-data: