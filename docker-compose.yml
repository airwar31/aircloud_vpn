version: '3'

services:
  aircloud-vpn:
    build: .
    container_name: aircloud-vpn
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./data:/app/data
      - ./logs:/var/log/xray
      - ./.env:/app/.env
    environment:
      - TZ=Europe/Moscow
    command: >
      sh -c "
        python -c \"import asyncio; from xray_api import XrayAPI; asyncio.run(XrayAPI().setup_reality())\" &&
        nohup /usr/local/bin/xray -config /etc/xray/config.json > /var/log/xray/access.log 2> /var/log/xray/error.log &
        sleep 2 &&
        python main.py
      "