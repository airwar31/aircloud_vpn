version: '3.8'

services:
  xray-api:
    build: .
    container_name: xray-vpn
    ports:
      - "8080:8080"  # API порт
      - "443:443"    # VPN порт
    env_file:
      - .env
    volumes:
      - ./xray-config:/etc/xray
      - ./xray-logs:/var/log/xray
    restart: unless-stopped
    networks:
      - vpn-network

  vpn-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: vpn-bot
    env_file:
      - .env
    environment:
      - XRAY_API_URL=http://xray-api:8080
    volumes:
      - ./bot-data:/app/data
    depends_on:
      - xray-api
    restart: unless-stopped
    networks:
      - vpn-network

networks:
  vpn-network:
    driver: bridge

volumes:
  xray-config:
  xray-logs:
  bot-data: