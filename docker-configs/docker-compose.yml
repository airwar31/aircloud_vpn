version: '3.8'

services:
  nl-server:
    build:
      context: ./nl-server
      dockerfile: Dockerfile
    container_name: nl-xray-server
    ports:
      - "443:443"       # Double tunnel (от VK)
      - "8443:8443"     # Single tunnel (от клиентов)
    networks:
      - vpn-network
    restart: unless-stopped
    environment:
      - TZ=UTC
    volumes:
      - ./nl-server/config.json:/etc/xray/config.json:ro
      - xray-certs:/etc/xray/certs

  vpn-bot:
    build:
      context: ./nl-server
      dockerfile: Dockerfile.bot
    container_name: vpn-telegram-bot
    depends_on:
      - nl-server
    networks:
      - vpn-network
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - XRAY_API_URL=http://nl-server:8080
      - NL_SERVER=nl-server
      - TZ=UTC
    volumes:
      - ./nl-server/bot_app:/app
      - shared-db:/shared
    env_file:
      - .env

networks:
  vpn-network:
    driver: bridge

volumes:
  xray-certs:
    driver: local
  shared-db:
    driver: local
