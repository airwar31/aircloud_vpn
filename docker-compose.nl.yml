version: '3.8'

services:
  # NL Xray сервер (Single и Double tunnel)
  nl-xray:
    build:
      context: ./docker-configs/nl-server
      dockerfile: Dockerfile
    container_name: nl-xray
    restart: unless-stopped
    networks:
      - vpn-network
    ports:
      - "443:443"   # Double tunnel (от VK)
      - "8443:8443" # Single tunnel (от клиентов)
    volumes:
      - ./docker-configs/nl-server:/etc/xray
      - xray-certs:/etc/xray/certs
    environment:
      - CONFIG_PATH=/etc/xray/config.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # VPN Bot (управление подписками, генерация VLESS ссылок)
  vpn-bot:
    build:
      context: ./docker-configs/nl-server
      dockerfile: Dockerfile.bot
    container_name: vpn-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - XRAY_API_URL=http://localhost:8080
      - NL_SERVER_IP=85.239.56.174
      - VK_SERVER_IP=89.208.86.167
      - BOT_TOKEN=${BOT_TOKEN}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
    networks:
      - vpn-network
    volumes:
      - shared-db:/shared
      - ./docker-configs/nl-server/bot_app:/app
    depends_on:
      - nl-xray
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8080/api/stats')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  xray-certs:
    driver: local
  shared-db:
    driver: local

networks:
  vpn-network:
    driver: bridge
