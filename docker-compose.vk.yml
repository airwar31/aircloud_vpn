version: '3.8'

services:
  # VK Xray сервер (Reality обфускация для Double tunnel)
  vk-xray:
    build:
      context: ./docker-configs/vk-server
      dockerfile: Dockerfile
    container_name: vk-xray
    restart: unless-stopped
    networks:
      - vpn-network
    ports:
      - "443:443"       # Double tunnel вход (Reality обфускация)
      - "8080:8080"     # Xray API
    volumes:
      - ./docker-configs/vk-server/config.json:/etc/xray/config.json:ro
      - xray-certs:/etc/xray/certs
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 3xui Панель управления
  vk-xray-panel:
    image: teddysun/x-ui:latest
    container_name: vk-xray-panel
    restart: unless-stopped
    networks:
      - vpn-network
    ports:
      - "54321:54321"   # Web панель 3xui (http://server:54321)
    volumes:
      - vk-xui-data:/etc/x-ui
    environment:
      - TZ=UTC
    depends_on:
      - vk-xray

volumes:
  xray-certs:
    driver: local
  vk-xui-data:
    driver: local

networks:
  vpn-network:
    driver: bridge
